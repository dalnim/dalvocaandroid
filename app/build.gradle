def tesseract4AndroidVersion= '4.4.0'

dependencies {
    implementation "androidx.core:core:1.9.0" //PlayerService에서 Context.RECEIVER_NOT_EXPORTED를 사용하기 위해 추가. 이버전을 올리면 gradle등 버전도 따로 올려야해서 이버전으로 함.
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/jaudiotagger-2.2.4-SNAPSHOT.jar')
    implementation 'androidx.media3:media3-common:1.8.0'  // ExoPlayer 2.19.1의 exoplayer-ui가 androidx.media에 의존하므로 필요
//Try to use this for Android 7. (2.2.6 has No Such method error issue) //https://bitbucket.org/ijabz/jaudiotagger/downloads/
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'com.jakewharton:butterknife:10.2.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.1'
    implementation 'com.google.code.gson:gson:2.6.2'
    implementation 'com.squareup.retrofit2:retrofit:2.0.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.0.2'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0' // 스트링을 받아왔을때 다 보여줄려면 이걸 써야 한다.
    implementation 'com.squareup.okhttp3:okhttp:4.8.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.4.1'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.4.1'
    implementation 'org.greenrobot:eventbus:3.0.0'
    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'com.github.ksoichiro:android-observablescrollview:1.6.0'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'com.google.android.gms:play-services-ads:22.0.0' //버전을 최신걸로 올리면 클래스 중복이 나타서 firebase-core도 같이 버전을 올렸다.
//    implementation 'com.anjlab.android.iab.v3:library:1.0.+' //Dalnim : Don't use this Billing Library, need to upgrade to Billing Library Version 3 later
    implementation 'org.florescu.android.rangeseekbar:rangeseekbar-library:0.3.0'
    // recycler view
    implementation 'com.github.nikhilpanju:RecyclerViewEnhanced:1.1'
//    compile project(':ijkplayer-armv7a')

//    compile project(':ijkplayer-java')
//    compile project(':ijkplayer-arm64')
//    compile project(':ijkplayer-armv5')
//    compile project(':ijkplayer-x86')
//    compile project(':ijkplayer-x86_64')
//    compile files('libs/juniversalchardet-1.0.3.jar')
    implementation "com.daimajia.swipelayout:library:1.2.0@aar"
    implementation 'com.uphyca:stetho_realm:2.0.0'
    implementation 'com.facebook.stetho:stetho:1.5.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-storage:20.0.0'
    implementation 'com.google.firebase:firebase-auth:21.0.1'
    implementation 'com.google.firebase:firebase-firestore:23.0.4'
    implementation 'com.google.firebase:firebase-analytics:19.0.2'
    implementation 'com.google.firebase:firebase-crashlytics:18.2.3'
    implementation 'com.google.firebase:firebase-messaging:22.0.0'
