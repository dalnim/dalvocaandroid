apply plugin: 'com.android.application'
apply plugin: 'realm-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.jakewharton.butterknife'
apply plugin: 'com.google.protobuf'

ext {
//    supportLibraryVersion = '25.4.0'
    grpcVersion = '1.24.0'
}

android {
    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword 'dal8121'
            storeFile file("${rootProject.projectDir}/realease_key_dalread.jks")
            storePassword 'dal8121'
        }
    }
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.dalread"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 2
        versionName "1.1"
        multiDexEnabled true
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86",'x86_64' //support arm 32bit/64 bit, x86 32bit/64 bit
//            abiFilters "arm64-v8a" //Dalnim added this code to support only arm 64 bit.
        }
        packagingOptions {
            exclude 'META-INF/INDEX.LIST'
            exclude 'META-INF/DEPENDENCIES'
            exclude 'google/protobuf/**'
//            exclude '**/com.google.type.TimeZoneOrBuilder.class'

//            exclude 'google/protobuf/empty.proto'
//            exclude 'google/protobuf/field_mask.proto'
//            exclude 'google/protobuf/type.proto'
//            exclude 'google/protobuf/struct.proto'
        }
        configurations {
            // Duplicate class com.google.api.Advice found in modules
            // jetified-proto-google-common-protos-2.9.6 (com.google.api.grpc:proto-google-common-protos:2.9.6)
            // and jetified-protolite-well-known-types-18.0.0-runtime (com.google.firebase:protolite-well-known-types:18.0.0)
            // → Firebase 쪽 protolite-well-known-types를 제외해서 중복 클래스 제거
            aradicengImplementation.exclude module: 'protolite-well-known-types'

            // Duplicate class com.google.protobuf.AbstractMessageLite found in modules
            // jetified-protobuf-java-3.21.8 (com.google.protobuf:protobuf-java:3.21.8)
            // and jetified-protobuf-javalite-3.21.7 (com.google.protobuf:protobuf-javalite:3.21.7)
            // → aradiceng flavor에서는 javalite 쪽을 제외해서 충돌 제거
            aradicengImplementation.exclude module: 'protobuf-javalite'
        }
    }

        // 16KB 페이지 크기: r28+는 기본 16KB 정렬 (자체 네이티브 빌드 없어도 서드파티 AAR 빌드 환경 일치)
    ndkVersion '28.0.13004108'
    dexOptions {
        javaMaxHeapSize "4g"
    }
    buildTypes {
        debug {
            versionNameSuffix ".5b0cef4"
            manifestPlaceholders = [crashlyticsEnabled: false]
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            manifestPlaceholders = [crashlyticsEnabled: true]
            ndk {
                debugSymbolLevel 'FULL'
            }
            // Baseline profile 검증 실패(INSTALL_BASELINE_PROFILE_FAILED)로 설치 거부되는 문제 방지
            installation {
                enableBaselineProfile false
            }
        }
    }
    // 16KB 페이지 크기 지원: 서드파티 .so가 4KB 정렬일 때 설치 이슈 우회 (Google Play 요구사항)
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.2'
//        resolutionStrategy.force "com.android.support:support-annotations:$supportLibraryVersion"
        // SafetyNet deprecated → Play Integrity API 권장. 앱에서 미사용이므로 제외해 경고 제거
        exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
    }
    flavorDimensions "dalnim"
    productFlavors {
        aradiceng {
            dimension "dalnim"
            applicationId 'com.dalnimsoft.aradiceng'
            minSdkVersion 26
            targetSdkVersion 30
            versionCode 1
            versionName '0.0.1'
            proguardFile 'proguard-rules.pro'
            buildConfigField 'String', 'STUDY_LANG', '"ENGLISH"'
            buildConfigField 'String', 'VOICELANG', '"en-US"'
            buildConfigField 'String', 'BOOKMARK_URL', '"http://www.cctv.com"'
            buildConfigField 'String', 'BOOKMARK_TITLE', '"CCTV 央视网"'
            buildConfigField 'String', 'SETTING_SPEAK', '"让我们学汉语"'
            buildConfigField 'int', 'SETTING_TTS_SPEED', '50'
            buildConfigField 'int', 'DB_VERSION', '3'  //
        }
        arakoica {
            dimension "dalnim"
            applicationId 'com.dalnimsoft.arakoica'
            minSdkVersion 26
            targetSdkVersion 33
            versionCode 7
